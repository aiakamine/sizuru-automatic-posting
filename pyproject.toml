[project]
name = "sizuru-post"
version = "0.1.0"
description = "Post a local 9:16 MP4 to TikTok / Instagram Reels / X via Buffer, with Supabase-backed audit trail."
authors = [
    { name = "畑　来世人", email = "kiyotong0612@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "boto3>=1.34",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "supabase>=2.6",
    "pyjwt[crypto]>=2.14.0",
]

[project.scripts]
sizuru-post = "sizuru_post.cli:app"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[s3]>=1.34",
]

[tool.ruff]
line-length = 110
target-version = "py312"
# Vendored third-party code (see src/sizuru_post/_vendor/README.md) — not
# ours to restyle.
extend-exclude = ["src/sizuru_post/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
# Vendored third-party code (see src/sizuru_post/_vendor/README.md) — not
# ours to type-check.
exclude = ["^src/sizuru_post/_vendor/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "supabase.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sizuru_post._vendor.*"]
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
