AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  sizuru admin dashboard backend: an HTTP API (no gateway-level authorizer
  — ApiFunction verifies the Supabase JWT itself; see infra/sam/README.md)
  in front of two Python Lambdas that reuse sizuru-post's existing
  Publisher (edit/cancel/sync), an EventBridge Scheduler rule that syncs
  every 15 minutes, and S3 + CloudFront (OAC) static hosting for the
  Next.js frontend build. See infra/sam/README.md for deploy steps.

Parameters:
  SupabaseUrl:
    Type: String
    Description: Supabase project URL, e.g. https://hdqrvhnhlyykocphetfg.supabase.co
  SupabaseJwtIssuer:
    Type: String
    Default: https://hdqrvhnhlyykocphetfg.supabase.co/auth/v1
    Description: >
      Supabase Auth JWT issuer. Passed to ApiFunction as SUPABASE_JWT_ISSUER
      and verified there with PyJWT (see api/auth.py) — NOT consumed by an
      HTTP API authorizer, since API Gateway's native JWT authorizer only
      supports RSA and Supabase signs with ES256.
  SupabaseJwtAudience:
    Type: String
    Default: authenticated
    Description: Expected JWT "aud" claim, passed to ApiFunction as SUPABASE_JWT_AUDIENCE.
  SsmParameterPrefix:
    Type: String
    Default: /sizuru/
    Description: >
      Prefix for the SecureString parameters holding BUFFER_API_KEY and
      SUPABASE_SERVICE_ROLE_KEY. Both Lambdas resolve these at runtime
      (factory.build_settings(), cached per container) rather than
      receiving them as plain Lambda environment variables.
  AllowedFrontendOrigin:
    Type: String
    Description: >
      The CloudFront domain the frontend is served from, e.g.
      https://d111111abcdef8.cloudfront.net. Allowed as a CORS origin in
      addition to http://localhost:3000 (local frontend dev).
  LogRetentionDays:
    Type: Number
    Default: 30

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    # 29s: HTTP API's own maximum integration timeout — ApiFunction (the
    # request/response path) must never exceed what API Gateway itself will
    # wait for. SyncFunction overrides this below since it's invoked by
    # EventBridge Scheduler, not API Gateway, and can run much longer.
    Timeout: 29
    MemorySize: 512
    Environment:
      Variables:
        SSM_PREFIX: !Ref SsmParameterPrefix
        SUPABASE_URL: !Ref SupabaseUrl

Resources:
  # ---------------------------------------------------------------------------
  # Lambdas — both reuse the existing sizuru_post.publisher.Publisher via
  # factory.build_publisher_without_uploads (no S3 config needed/used here).
  # ---------------------------------------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../../
      Handler: sizuru_post.api.handler.handler
      Description: Admin dashboard API — PATCH/cancel/sync a post via Publisher.
      # Only ApiFunction needs these (SyncFunction has no HTTP caller to
      # authenticate) — it verifies the Supabase JWT itself, in-process
      # (see api/auth.py / api/handler.py::_authenticate).
      Environment:
        Variables:
          SUPABASE_JWT_ISSUER: !Ref SupabaseJwtIssuer
          SUPABASE_JWT_AUDIENCE: !Ref SupabaseJwtAudience
      Policies:
        - Statement:
            - Sid: ReadSizuruSecrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}BUFFER_API_KEY"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}SUPABASE_SERVICE_ROLE_KEY"
      Events:
        EditPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{post_id}
            Method: PATCH
        CancelPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{post_id}/cancel
            Method: POST
        Sync:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sync
            Method: POST
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: !Ref LogRetentionDays

  SyncFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../../
      Handler: sizuru_post.api.sync_handler.handler
      Description: EventBridge Scheduler target — Publisher.sync() every 15 minutes.
      # Not bound by the HTTP API's 29s integration limit; sequentially
      # syncing every scheduled/draft post can take a while. Publisher.sync's
      # should_stop deadline check (see api/_deadline.make_should_stop)
      # leaves ~15s of headroom to stop cleanly and report truncated:true
      # before this timeout would kill the invocation mid-post.
      Timeout: 300
      Policies:
        - Statement:
            - Sid: ReadSizuruSecrets
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}BUFFER_API_KEY"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}SUPABASE_SERVICE_ROLE_KEY"
  SyncFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SyncFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # EventBridge Scheduler: rate(15 minutes) -> SyncFunction. Scheduler invokes
  # Lambda via an IAM role (not a resource-based Lambda permission like
  # classic EventBridge Rules), so no AWS::Lambda::Permission is needed here.
  # ---------------------------------------------------------------------------
  SyncSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSyncFunction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SyncFunction.Arn

  SyncSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-sync"
      Description: Polls Buffer for posts whose due_at has passed and updates Supabase.
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt SyncFunction.Arn
        RoleArn: !GetAtt SyncSchedulerRole.Arn

  # ---------------------------------------------------------------------------
  # HTTP API: deliberately has NO authorizer attached. API Gateway HTTP
  # API's native JWT authorizer only verifies RSA-signed tokens
  # (RS256/RS512), but Supabase Auth signs access tokens with ES256 (EC
  # P-256) — the authorizer would reject every real token. ApiFunction
  # verifies the token itself instead, with PyJWT (see api/auth.py /
  # api/handler.py::_authenticate), then checks admin_users (see
  # api/handler.py::_require_admin). Every route is therefore unauthenticated
  # at the gateway layer; do not add a route here without auth logic in the
  # Lambda handler. CORS is entirely API Gateway-managed, not set in Lambda
  # responses.
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # No route below defines an explicit OPTIONS method, so API Gateway
      # answers CORS preflight OPTIONS requests itself (per this
      # CorsConfiguration) without invoking ApiFunction at all — the Lambda
      # never sees an unauthenticated OPTIONS request to worry about.
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedFrontendOrigin
          - http://localhost:3000
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300

  # ---------------------------------------------------------------------------
  # Frontend hosting: private S3 bucket, readable only by CloudFront via OAC.
  # SPA routing: 403/404 (unknown client-side route) -> /index.html, 200.
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          # AWS-managed "CachingOptimized" policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # next export's static HTML doesn't have real routes for client-side
        # paths, so both 403 (private bucket + missing key) and 404 fall
        # back to index.html and let the SPA's router take over.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: Base URL for the admin dashboard API (NEXT_PUBLIC_API_URL).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CloudFrontDomain:
    Description: CloudFront domain the frontend is served from.
    Value: !GetAtt CloudFrontDistribution.DomainName
  FrontendBucket:
    Description: S3 bucket to upload the Next.js static export into.
    Value: !Ref FrontendBucket
